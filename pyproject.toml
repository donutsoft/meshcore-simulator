[project]
name = "meshcore-simulator"
version = "0.1.0"
description = "Capture and model a MeshCore repeater topology for routing simulations"
readme = "README.md"
requires-python = ">=3.12"
license = "Unlicense"
dependencies = [
    "bleak>=0.22.0",
    "flask>=3.1.0",
    "pyserial>=3.5",
]

[project.scripts]
meshcore-simulator = "meshcore_simulator.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meshcore_simulator"]

[dependency-groups]
dev = ["pytest>=8.3.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
